<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- ── OPEN BOOK (white, flat, bottom half) ── -->
  <!-- Left page -->
  <path d="M48 460 L48 310 Q48 295 62 288 L245 268 L245 430 Q180 435 120 450 Z"
        fill="white"/>
  <!-- Left page edge layers (green shades) -->
  <path d="M48 430 L48 460 L120 450 L245 438 L245 430 Z" fill="#4ade80" opacity="0.5"/>
  <path d="M48 445 L48 460 L120 455 L245 444 L245 438 Z" fill="#16a34a" opacity="0.6"/>

  <!-- Right page -->
  <path d="M464 460 L464 310 Q464 295 450 288 L267 268 L267 430 Q332 435 392 450 Z"
        fill="white"/>
  <!-- Right page edge layers -->
  <path d="M464 430 L464 460 L392 450 L267 438 L267 430 Z" fill="#4ade80" opacity="0.5"/>
  <path d="M464 445 L464 460 L392 455 L267 444 L267 438 Z" fill="#16a34a" opacity="0.6"/>

  <!-- Book spine bottom point -->
  <path d="M245 430 L256 460 L267 430 L267 268 L256 272 L245 268 Z" fill="#15803d"/>

  <!-- ── LIGHT BULB ── -->
  <!-- Rays (mix white and light green, alternating) -->
  <!-- top center -->
  <rect x="249" y="52" width="14" height="36" rx="7" fill="white" transform="rotate(0 256 256)"/>
  <!-- top right 1 -->
  <rect x="249" y="52" width="14" height="28" rx="7" fill="#86efac" transform="rotate(30 256 256)"/>
  <!-- top right 2 -->
  <rect x="249" y="52" width="14" height="24" rx="7" fill="white" transform="rotate(60 256 256)"/>
  <!-- right -->
  <rect x="249" y="52" width="14" height="28" rx="7" fill="#86efac" transform="rotate(90 256 256)"/>
  <!-- top left 1 -->
  <rect x="249" y="52" width="14" height="28" rx="7" fill="#86efac" transform="rotate(-30 256 256)"/>
  <!-- top left 2 -->
  <rect x="249" y="52" width="14" height="24" rx="7" fill="white" transform="rotate(-60 256 256)"/>
  <!-- left -->
  <rect x="249" y="52" width="14" height="28" rx="7" fill="#86efac" transform="rotate(-90 256 256)"/>

  <!-- Bulb circle body -->
  <circle cx="256" cy="210" r="95" fill="url(#bulbGrad)"/>
  <!-- Bulb white rim -->
  <circle cx="256" cy="210" r="95" fill="none" stroke="white" stroke-width="10"/>

  <!-- Pencil inside bulb -->
  <!-- Pencil body - 3 stripes dark green -->
  <rect x="234" y="175" width="17" height="72" rx="4" fill="#166534"/>
  <rect x="247" y="170" width="18" height="77" rx="4" fill="#15803d"/>
  <rect x="261" y="175" width="17" height="72" rx="4" fill="#166534"/>
  <!-- Pencil tip point -->
  <polygon points="234,247 278,247 256,278" fill="#14532d"/>
  <!-- Pencil top (eraser flat) -->
  <rect x="234" y="168" width="44" height="10" rx="4" fill="#4ade80"/>

  <!-- Bulb base / coil (white stripes) -->
  <rect x="228" y="295" width="56" height="10" rx="5" fill="white"/>
  <rect x="228" y="309" width="56" height="10" rx="5" fill="white"/>
  <rect x="228" y="323" width="56" height="10" rx="5" fill="white"/>

  <!-- Bulb neck -->
  <rect x="234" y="335" width="44" height="18" rx="8" fill="#86efac"/>
</svg>
